services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: householddb
      POSTGRES_USER: household
      POSTGRES_PASSWORD: household
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U household -d householddb"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: household-backend:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/householddb
      SPRING_DATASOURCE_USERNAME: household
      SPRING_DATASOURCE_PASSWORD: household
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: household-frontend:latest
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data: